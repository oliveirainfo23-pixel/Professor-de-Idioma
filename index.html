<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Professor de Idioma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;--surface:#FFFFFF;--ink:#16203A;--muted:#566079;--line:#D3D9E4;--soft:#E4E9F3;
  --en:#2D5BD8;--es:#C98C00;--ok:#17804F;--bad:#BF3A30;--mid:#A86A00;
  --accent:var(--en);--on-accent:#FFFFFF;--accent-soft:#DCE5FB;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320;--surface:#181F30;--ink:#E7EBF4;--muted:#A0A9BC;--line:#2B3449;--soft:#1F2840;
    --en:#7C9CFF;--es:#F0B429;--ok:#4CC38A;--bad:#F07167;--mid:#E9B44C;--on-accent:#0F1320;--accent-soft:#25335A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320;--surface:#181F30;--ink:#E7EBF4;--muted:#A0A9BC;--line:#2B3449;--soft:#1F2840;
  --en:#7C9CFF;--es:#F0B429;--ok:#4CC38A;--bad:#F07167;--mid:#E9B44C;--on-accent:#0F1320;--accent-soft:#25335A;
}
body[data-lang="es"]{--accent:var(--es);--on-accent:#16130A;--accent-soft:color-mix(in srgb,var(--es) 18%,var(--surface))}
body[data-lang="en"]{--accent-soft:color-mix(in srgb,var(--en) 16%,var(--surface))}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{background:none;border:0;font-family:var(--display);font-weight:800;font-size:19px;cursor:pointer;padding:4px 0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:700;font-size:16px;min-height:44px;transition:0.15s ease}
.btn:hover{border-color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ladder */
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end}
.ladder li{position:relative;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 2px 2px;background:var(--soft);color:var(--muted);font-family:var(--display);font-weight:700;font-size:13px;padding:4px 0;text-align:center}
.ladder li:nth-child(1){height:22px}.ladder li:nth-child(2){height:30px}.ladder li:nth-child(3){height:38px}
.ladder li:nth-child(4){height:46px}.ladder li:nth-child(5){height:54px}.ladder li:nth-child(6){height:62px}
.ladder li.past{background:color-mix(in srgb,var(--accent) 35%,var(--soft));color:var(--ink)}
.ladder li.now{background:var(--accent);color:var(--on-accent)}

/* home */
.hero{padding:28px 0 22px}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.lede{color:var(--muted);font-size:19px;max-width:52ch;margin:14px 0 0}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.lang-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lang-card[data-l="en"]{--accent:var(--en);--on-accent:#fff}
.lang-card[data-l="es"]{--accent:var(--es);--on-accent:#16130A}
.lc-head{display:flex;justify-content:space-between;align-items:baseline}
.lc-head h2{font-size:26px}
.native{color:var(--muted);font-style:italic}
.lc-level{font-family:var(--display);font-weight:800;font-size:76px;line-height:.9;margin:4px 0 0;color:var(--accent);letter-spacing:-.04em}
.lc-level.empty{color:var(--line)}
.lc-stats{margin:0;color:var(--muted);font-size:15px}
.notice{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:15px}

/* course head */
.course-head{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding:22px 0 18px}
.ch-lang{margin:0;font-weight:700;color:var(--muted)}
.ch-level{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(84px,16vw,132px);line-height:.82;letter-spacing:-.05em;color:var(--accent)}
.ch-side{display:flex;flex-direction:column;gap:10px}
.ch-stats{margin:0;color:var(--muted);font-size:15px;display:flex;gap:18px;flex-wrap:wrap}
.ch-stats b{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* lessons list */
.lvl-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lvl-pills button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px}
.lvl-pills button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lesson-row{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.lesson-row:hover{border-color:var(--accent)}
.lr-n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.lesson-row.done .lr-n{color:var(--ok)}
.lr-t strong{display:block}
.lr-t small{color:var(--muted);font-size:14px}
.lr-s{font-size:14px;color:var(--ok);font-weight:700}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.panel h3{font-size:22px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:15px}
.reading{font-size:19px;line-height:1.7;max-width:66ch;white-space:pre-wrap}
.translation{color:var(--muted);border-left:3px solid var(--line);padding-left:14px;white-space:pre-wrap}
.vocab{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vocab li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.vocab li:last-child{border-bottom:0}
.vocab .term{font-weight:700}
.vocab .ex{grid-column:2;color:var(--muted);font-size:15px;font-style:italic}
.say-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say-btn svg{width:16px;height:16px}
.exercise{padding:16px 0;border-top:1px solid var(--line)}
.exercise:first-of-type{border-top:0;padding-top:4px}
.ex-q{font-weight:700;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt[disabled]{cursor:default}
.fb{margin:10px 0 0;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.fb.good{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}

/* speaking */
.say{padding:14px 0;border-top:1px solid var(--line)}
.say:first-child{border-top:0}
.say-text{font-size:19px;margin:0 0 10px}
.say-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w-ok{color:var(--ok);font-weight:700}
.w-miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-family:var(--display);font-weight:800;font-size:20px;margin-left:4px}
.score.good{color:var(--ok)}.score.mid{color:var(--mid)}.score.low{color:var(--bad)}
.heard{margin:8px 0 0;font-size:15px;color:var(--muted)}
.err{margin:8px 0 0;font-size:15px;color:var(--bad)}

/* placement */
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 24px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.q-big{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 22px}
.steps{margin:14px 0 22px;padding-left:22px}
.steps li{margin-bottom:8px}
.result-level{font-family:var(--display);font-weight:800;font-size:clamp(110px,24vw,180px);line-height:.8;letter-spacing:-.05em;color:var(--accent);margin:8px 0 18px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}
.bd{background:var(--soft);border-radius:14px;padding:14px 16px}
.bd h4{margin:0 0 6px;font-family:var(--display);font-size:17px}
.bd p{margin:0;font-size:15px}

/* chat */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.scen button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.scen button:hover{border-color:var(--accent)}
.scen strong{display:block;font-family:var(--display);font-size:18px}
.scen span{color:var(--muted);font-size:14px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.chat-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-bar strong{font-family:var(--display)}
.chat-log{height:min(56vh,520px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.tutor .bubble{background:var(--soft);border-bottom-left-radius:4px}
.msg.me .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.fix{font-size:14px;padding:8px 12px;border-radius:10px;border:1px dashed var(--mid);color:var(--ink);background:color-mix(in srgb,var(--mid) 8%,var(--surface))}
.msg-tools{display:flex;gap:6px;margin-top:2px}
.msg-tools button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;text-decoration:underline}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:46px;height:46px;resize:none;flex:1}
.mic{width:46px;height:46px;border-radius:50%;flex:none;padding:0}
.mic svg{width:20px;height:20px}
.audio-active{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ok);font-weight:700}

/* misc */
.loading{display:flex;gap:12px;align-items:center;padding:28px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw}
.back{margin:18px 0 6px}
.lesson-title{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.done-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.stat span{font-size:14px;color:var(--muted)}
@media (max-width:600px){
  .course-head{grid-template-columns:1fr;gap:10px}
  .msg{max-width:92%}
  .wrap{padding:14px 14px 56px}
  .panel{padding:18px}
}
</style>
</head>

const memoryStore = {};
function lsGet(k){
  try{
    const v = window.localStorage ? localStorage.getItem(k) : memoryStore[k];
    return v ? JSON.parse(v) : null;
  }catch(e){
    return memoryStore[k] ? JSON.parse(memoryStore[k]) : null;
  }
}
function lsSet(k,v){
  try{
    const val = JSON.stringify(v);
    if(window.localStorage) localStorage.setItem(k,val);
    memoryStore[k] = val;
  }catch(e){
    memoryStore[k] = JSON.stringify(v);
  }
}

/* ---------- MOTOR DE ÁUDIO E VOZ ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function listen(lang=S.lang){
  return new Promise((resolve, reject)=>{
    if(location.protocol === "file:"){
      return reject({code:"file-protocol"});
    }
    if(!SR){
      return reject({code:"no_sr"});
    }
    let rec;
    try{
      rec = new SR();
    }catch(e){
      return reject({code:"no_sr"});
    }

    rec.lang = LANGS[lang].bcp;
    rec.continuous = false;
    rec.interimResults = false;
    let finished = false;

    const timer = setTimeout(()=>{
      if(!finished){
        finished = true;
        try{rec.stop()}catch(e){}
        reject({code:"no-speech"});
      }
    }, 8000);

    rec.onresult = e => {
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      const text = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : "";
      resolve(text);
    };

    rec.onerror = e => {
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      reject({code: e.error || "unknown"});
    };

    rec.onend = () => {
      if(!finished){
        finished = true;
        clearTimeout(timer);
        reject({code:"no-speech"});
      }
    };

    try{
      rec.start();
    }catch(err){
      finished = true;
      clearTimeout(timer);
      reject({code:"busy"});
    }
  });
}

function srMsg(e){
  const c = e && e.code;
  if(c === "file-protocol"){
    return "Microfone bloqueado em 'file:///'. O navegador exige protocolo seguro (http://localhost ou https://). Pode utilizar o botão 'Digitar frase' para testar imediatamente.";
  }
  if(c === "no_sr") return "O navegador não suporta a Web Speech API. Recomendamos o Google Chrome ou Microsoft Edge.";
  if(c === "not-allowed") return "Permissão do microfone negada. Clique no ícone de definições ao lado do URL para permitir o acesso.";
  if(c === "no-speech") return "Nenhum som detetado. Clique novamente e comece a falar de imediato.";
  return "Não foi possível reconhecer o áudio. Pode introduzir a frase por texto no botão ao lado.";
}

let voices = [];
function loadVoices(){
  try{ voices = speechSynthesis.getVoices(); }catch(e){}
}
if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, lang=S.lang){
  if(!("speechSynthesis" in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const pref = LANGS[lang].bcp;
    u.lang = pref;
    u.rate = S.settings.rate || 0.95;
    
    if(voices.length === 0) loadVoices();
    const voice = voices.find(v => v.lang === pref) || voices.find(v => (v.lang||"").toLowerCase().startsWith(lang));
    if(voice) u.voice = voice;

    speechSynthesis.speak(u);
  }catch(e){
    console.warn("Erro ao sintetizar voz:", e);
  }
}

function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim();
}

function compare(target, said){
  const toks = target.split(/\s+/).filter(Boolean);
  const a = toks.map(t=>norm(t).replace(/\s/g,""));
  const b = norm(said).split(" ").filter(Boolean);
  const n = a.length, m = b.length;
  const dp = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]&&a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i+1][j+1]);
  const ok = new Array(n).fill(false);
  let i=0, j=0;
  while(i<n && j<m){
    if(a[i] && a[i]===b[j]){ok[i]=true;i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]) i++;
    else j++;
  }
  const real = a.filter(Boolean).length || 1;
  const hit = a.filter((w,k)=>w&&ok[k]).length;
  return {score:Math.round(hit/real*100), words:toks.map((t,k)=>({t,ok:ok[k]}))};
}

function today(){return new Date().toLocaleDateString("sv");}
function bumpStreak(p){
  const t = today();
  if(p.lastDay===t) return;
  const y = new Date(Date.now()-864e5).toLocaleDateString("sv");
  p.streak = p.lastDay===y ? p.streak+1 : 1;
  p.lastDay = t;
}

async function doSR(id, t){
  U.speak[id] = {...(U.speak[id]||{}), listening:true, err:""};
  render();
  try{
    const heard = await listen(S.lang);
    const c = compare(t, heard);
    U.speak[id] = {heard, score:c.score, words:c.words, listening:false};
  }catch(e){
    U.speak[id] = {...(U.speak[id]||{}), listening:false, err:srMsg(e), showDict:true};
  }
  render();
}

      <div class="panel">${PL_SPEAK[S.lang].map((s,i)=>speakItem("pl-"+S.lang+"-"+i, s.t)).join("")}</div>
      <button class="btn primary" data-act="plresult">Finalizar e Obter Nível</button>`;
  }else{
    const r = pl.result;
    const chosen = pl.chosen;
    body = `<p class="muted">O seu nível apurado em ${L().name.toLowerCase()}:</p>
      <p class="result-level">${chosen}</p>
      ${ladder(chosen)}
      <div class="breakdown">
        <div class="bd"><h4>Gramática e Léxico: ${LEVELS[r.mcq]}</h4><p>${r.correct} de 15 respostas certas</p></div>
        <div class="bd"><h4>Escrita: ${r.w!=null?LEVELS[r.w]:"Não avaliada"}</h4><p>${pl.wres?esc(pl.wres.strengths):"Etapa ignorada."}</p></div>
        <div class="bd"><h4>Pronúncia: ${r.s!=null?LEVELS[r.s]:"Não avaliada"}</h4><p>${r.s!=null?`Média: ${r.sAvg}%`:"Sem registo oral."}</p></div>
      </div>
      <button class="btn primary" data-act="plfinish">Começar o Curso no Nível ${chosen}</button>`;
  }
  return `<main class="wrap"><p class="back"><button class="linkish" data-act="home">← Voltar ao Início</button></p>${body}</main>`;
}

function computeResult(){
  const pl = U.pl;
  const bank = BANK[S.lang];
  const per = [0,1,2,3,4].map(l => bank.reduce((c,q,i)=>c+(q.l===l && pl.ans[i]===q.a ? 1 : 0), 0));
  let mcq = 0;
  for(let l=0; l<5; l++){ if(per[l]>=2) mcq=l; else break; }
  const correct = per.reduce((a,b)=>a+b, 0);
  const w = pl.wres ? LEVELS.indexOf(pl.wres.level) : null;
  const sp = PL_SPEAK[S.lang].map((s,i)=>({l:s.l, r:U.speak["pl-"+S.lang+"-"+i]})).filter(x=>x.r&&x.r.score!=null);
  let s = null, sAvg = 0;
  if(sp.length){
    sAvg = Math.round(sp.reduce((a,x)=>a+x.r.score,0)/sp.length);
    s = 0;
    sp.forEach(x=>{ if(x.r.score>=70) s=Math.max(s,x.l); });
  }
  const parts = [[mcq, 0.55]];
  if(w!=null) parts.push([w, 0.3]);
  if(s!=null) parts.push([s, 0.15]);
  const tw = parts.reduce((a,p)=>a+p[1], 0);
  const final = Math.max(0, Math.min(5, Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/tw)));
  pl.result = {per, mcq, correct, w, s, sAvg};
  pl.chosen = LEVELS[final];
}

async function plWrite(){
  const pl = U.pl;
  const txt = (pl.wtext||"").trim();
  if(!txt){ toast("Escreva uma frase antes de avaliar."); return; }
  pl.wbusy = true; render();
  pl.wres = await ai(`Avalie o nível QECR: ${txt}`, true);
  pl.wbusy = false; render();
}

function course(){
  const p = P();
  if(!p.level){ U.view="home"; return home(); }
  const tab = U.tab;
  return `<main class="wrap">
    <section class="course-head">
      <div><p class="ch-lang">${L().name}</p><p class="ch-level">${p.level}</p></div>
      <div class="ch-side">
        ${ladder(p.level)}
        <p class="ch-stats"><span><b>${p.xp}</b> XP</span><span><b>${p.streak}</b> ${p.streak===1?"dia":"dias"} seguidos</span><span><b>${Object.keys(p.done).length}</b> lições concluídas</span></p>
      </div>
    </section>
    <nav class="tabs" role="tablist">
      ${[["lessons","Lições"],["chat","Conversação"],["speak","Pronúncia"],["progress","Progresso"]].map(([k,n])=>`<button role="tab" data-act="tab" data-v="${k}" aria-selected="${tab===k}">${n}</button>`).join("")}
    </nav>
    ${tab==="lessons"?lessonsList():tab==="chat"?chatView():tab==="speak"?drillView():progressView()}
  </main>`;
}

function lessonsList(){
  const lv = U.browse || P().level;
  return `<div class="lvl-pills">
    ${LEVELS.map(l=>`<button data-act="browse" data-v="${l}" aria-pressed="${l===lv}">${l}${l===P().level?" (atual)":""}</button>`).join("")}
  </div>
  <ol class="lessons">
    ${TOPICS[lv].map((t,i)=>{
      const key = `${lv}-${i}`;
      const done = P().done[key];
      return `<li><button class="lesson-row ${done?"done":""}" data-act="lesson" data-v="${key}">
        <span class="lr-n">${i+1}</span>
        <span class="lr-t"><strong>${t[0]}</strong><small>${t[1]}</small></span>
        <span class="lr-s">${done?"Concluída ✓":""}</span>
      </button></li>`;
    }).join("")}
  </ol>`;
}

async function openLesson(key){
  const [lv,i] = key.split("-");
  const t = TOPICS[lv][+i];
  U.lesson = {key, lv, topic:t, data:null, loading:true, inputs:{}, checked:{}, mc:{}, tr:{}, wtext:"", wres:null, showTr:false};
  U.view = "lesson"; render(); window.scrollTo(0,0);

  const d = await ai(`Lição de nível ${lv} sobre ${t[0]}`, true);
  U.lesson.data = d;
  U.lesson.loading = false;
  render();
}

function lessonView(){
  const ls = U.lesson;
  const back = `<p class="back"><button class="linkish" data-act="backcourse">← Voltar às Lições</button></p>`;
  if(ls.loading) return `<main class="wrap">${back}<h1 class="lesson-title">${esc(ls.topic[0])}</h1><div class="loading">A preparar materiais de nível ${ls.lv}...</div></main>`;

  const d = ls.data;
  return `<main class="wrap">
    ${back}
    <p class="muted small" style="margin:0">Nível ${ls.lv} • ${esc(ls.topic[1])}</p>
    <h1 class="lesson-title">${esc(d.title || ls.topic[0])}</h1>
    <p class="lede" style="margin-top:0;margin-bottom:20px">${esc(d.intro)}</p>
    
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h3 style="margin:0">Texto de Leitura</h3>
        <button class="btn ghost sm" data-act="tts" data-t="${esc(d.reading.text)}">${ICON_SPK} Ouvir texto</button>
      </div>
      <p class="reading">${esc(d.reading.text)}</p>
      ${ls.showTr ? `<p class="translation">${esc(d.reading.translation)}</p>` : ""}
      <button class="linkish" data-act="toggletr">${ls.showTr?"Ocultar tradução":"Ver tradução em português"}</button>
    </section>

    <section class="panel">
      <h3>Vocabulário</h3>
      <ul class="vocab">
        ${d.vocabulary.map(v=>`<li><button class="say-btn" data-act="tts" data-t="${esc(v.term)}">${ICON_SPK}</button><div><span class="term">${esc(v.term)}</span> — <span class="muted">${esc(v.translation)}</span></div></li>`).join("")}
      </ul>
    </section>

    <section class="panel">
      <h3>Exercícios</h3>
      ${d.exercises.map((e,i)=>exerciseHTML(e,i)).join("")}
    </section>

    <section class="panel">
      <h3>Prática Oral</h3>
      ${d.speaking.map((s,i)=>speakItem(`ls-${S.lang}-${ls.key}-${i}`, s)).join("")}
    </section>

    <section class="panel done-bar">
      <div><b>Concluiu todas as atividades?</b><p class="muted small" style="margin:0">Grave o seu progresso e acumule pontos de experiência.</p></div>
      <button class="btn primary" data-act="complete">Concluir Lição (+35 XP)</button>
    </section>
  </main>`;
}

function exerciseHTML(e,i){
  const ls = U.lesson;
  if(e.type === "mc"){
    const ch = ls.mc[i];
    const ans = ch != null;
    return `<div class="exercise">
      <p class="ex-q">${i+1}. ${esc(e.prompt)}</p>
      <div class="opts">
        ${e.options.map((o,j)=>`<button class="opt ${ans&&j===e.answer?"right":""} ${ans&&j===ch&&j!==e.answer?"wrong":""}" data-act="mc" data-i="${i}" data-o="${j}" ${ans?"disabled":""}>${esc(o)}</button>`).join("")}
      </div>
      ${ans ? `<p class="fb ${ch===e.answer?"good":"bad"}">${ch===e.answer?"Correto!":"A resposta certa é: "+esc(e.options[e.answer])} ${esc(e.explain||"")}</p>` : ""}
    </div>`;
  }
  if(e.type === "fill"){
    const st = ls.checked[i];
    return `<div class="exercise">
      <p class="ex-q">${i+1}. Preencha: ${esc(e.prompt)}</p>
      <div class="inline-form">
        <input type="text" data-k="lesson.inputs.${i}" value="${esc(ls.inputs[i]||"")}" placeholder="Sua resposta" ${st==="ok"?"disabled":""}>
        <button class="btn sm" data-act="fill" data-i="${i}" ${st==="ok"?"disabled":""}>Verificar</button>
      </div>
      ${st ? `<p class="fb ${st==="ok"?"good":"bad"}">${st==="ok"?"Excelente! Resposta correta.":"Resposta esperada: "+esc(e.answer)}</p>` : ""}
    </div>`;
  }
  return `<div class="exercise">
    <p class="ex-q">${i+1}. Traduza: “${esc(e.pt)}”</p>
    <div class="inline-form">
      <input type="text" data-k="lesson.inputs.${i}" value="${esc(ls.inputs[i]||"")}" placeholder="Escreva em ${L().name.toLowerCase()}">
      <button class="btn sm" data-act="trcheck" data-i="${i}">Validar</button>
    </div>
    ${ls.tr[i] && ls.tr[i].res ? `<p class="fb good">Referência correta: <b>${esc(e.answer)}</b></p>` : ""}
  </div>`;
}

function completeLesson(){
  const ls = U.lesson;
  const p = P();
  p.xp += 35;
  p.done[ls.key] = true;
  bumpStreak(p);
  save();
  U.view = "course";
  U.tab = "lessons";
  U.lesson = null;
  toast("Lição concluída! +35 XP adicionados.");
}

/* ---------- CONVERSAÇÃO / CHAT COM ÁUDIO ATIVO ---------- */
function chatView(){
  const c = U.chat[S.lang];
  if(!c){
    return `<p class="muted" style="margin-top:0">Escolha um cenário para iniciar um diálogo por áudio e texto com o professor virtual[cite: 1]:</p>
      <div class="scen">${SCEN.map(s=>`<button data-act="scen" data-v="${s.k}"><strong>${s.t}</strong><span>${s.d}</span></button>`).join("")}</div>`;
  }
  const sc = SCEN.find(s=>s.k===c.scenario) || SCEN[0];
  return `<div class="chat">
    <div class="chat-bar">
      <div>
        <strong>${sc.t}</strong>
        <span class="audio-active" style="margin-left:10px;">${ICON_SPK} Áudio Automático Ativo</span>
      </div>
      <button class="btn ghost sm" data-act="chatreset">Mudar cenário</button>
    </div>
    <div class="chat-log" id="chat-log">
      ${c.msgs.map(m=>`<div class="msg ${m.who}">
        <div class="bubble">${esc(m.text)}</div>${m.fix?`<div class="fix">${esc(m.fix)}</div>`:""}
        ${m.who==="tutor"?`<div class="msg-tools"><button data-act="tts" data-t="${esc(m.text)}">${ICON_SPK} Ouvir pergunta novamente</button></div>`:""}
      </div>`).join("")}
    </div>
    <div class="composer">
      <button class="btn mic ${U.listening?"rec":""}" data-act="chatmic" aria-label="Falar pelo microfone">${ICON_MIC}</button>
      <textarea id="chat-in" data-k="chatInput" placeholder="Responda por voz pelo microfone ou digite aqui...">${esc(U.chatInput)}</textarea>
      <button class="btn primary" data-act="chatsend">Enviar</button>
    </div>
  </div>`;
}

function startScenario(scenarioKey){
  const lang = S.lang;
  const initialText = SCEN_FIRST_QUESTION[lang][scenarioKey] || (lang === "en" ? "Hello! How can I help you today?" : "¡Hola! ¿Cómo estás hoy?");

  U.chat[lang] = {
    scenario: scenarioKey,
    msgs: [
      { who: "tutor", text: initialText, fix: "" }
    ]
  };

  render();
  
  // Realiza a pergunta inicial imediatamente em áudio
  setTimeout(() => {
    speak(initialText, lang);
  }, 250);
}

async function chatSend(){
  const c = U.chat[S.lang];
  if(!c) return;
  const t = (U.chatInput||"").trim();
  if(!t) return;
  c.msgs.push({who:"me", text:t});
  U.chatInput = "";
  render();

  const r = await ai(c.msgs, false);
  const text = r.text || "";
  const parts = text.split("✎");
  const replyText = parts[0].trim();
  const feedback = parts[1] ? parts[1].trim() : "";

  c.msgs.push({who:"tutor", text:replyText, fix:feedback});
  render();

  // Reproduz a réplica/pergunta seguinte do professor em áudio
  speak(replyText, S.lang);
}

async function chatMic(){
  U.listening = true; render();
  try{
    const heard = await listen(S.lang);
    U.listening = false;
    U.chatInput = heard;
    chatSend();
  }catch(e){
    U.listening = false;
    toast(srMsg(e));
    render();
  }
}

function drillView(){
  const d = U.drill[S.lang];
  return `<div class="panel">
    <h3>Treino de Pronúncia</h3>
    <p class="muted small">Gere frases fonéticas adaptadas ao seu nível para aperfeiçoar a entoação[cite: 1].</p>
    <div class="row" style="margin-bottom:12px"><button class="btn primary" data-act="drillgen">Gerar Frases</button></div>
  </div>
  ${d.items.length ? `<div class="panel">${d.items.map((s,i)=>speakItem(`dr-${S.lang}-${i}`, s)).join("")}</div>` : ""}`;
}

async function drillGen(){
  U.drill[S.lang].items = await ai("Gere 5 frases", true);
  render();
}

function progressView(){
  const p = P();
  return `<div class="panel">
    <h3>Estatísticas de Estudo</h3>
    <div class="stat-grid">
      <div class="stat"><b>${p.xp}</b><span>Pontos XP</span></div>
      <div class="stat"><b>${p.streak}</b><span>Dias de sequência</span></div>
      <div class="stat"><b>${Object.keys(p.done).length}</b><span>Lições concluídas</span></div>
    </div>
  </div>
  <div class="panel">
    <h3>Redefinir</h3>
    <button class="btn ghost" style="color:var(--bad);border-color:var(--bad)" data-act="reset">Zerar progresso</button>
  </div>`;
}

/* ---------- CONTROLADOR DE EVENTOS ---------- */
const ACT = {
  home(){ U.view="home"; U.lesson=null; render(); },
  lang(d){ S.lang=d.v; save(); U.view="course"; if(!P().level) U.view="home"; render(); },
  open(d){ S.lang=d.v; save(); U.view="course"; render(); },
  startpl(d){ S.lang=d.v; save(); U.pl={step:"intro",i:0,ans:[],wtext:"",wres:null}; U.view="placement"; render(); },
  plgo(){ U.pl.step="mcq"; render(); },
  plans(d){
    U.pl.ans[U.pl.i] = +d.v;
    U.pl.i++;
    if(U.pl.i >= BANK[S.lang].length) U.pl.step="write";
    render();
  },
  plwrite(){ plWrite(); },
  plnext(d){ U.pl.step=d.v; render(); },
  plresult(){ computeResult(); U.pl.step="result"; render(); },
  plfinish(){
    const p = P();
    p.level = U.pl.chosen;
    p.history.push({date:today(), level:U.pl.chosen});
    save();
    U.view = "course";
    U.tab = "lessons";
    render();
  },
  tab(d){ U.tab=d.v; render(); },
  browse(d){ U.browse=d.v; render(); },
  lesson(d){ openLesson(d.v); },
  backcourse(){ U.lesson=null; U.view="course"; render(); },
  toggletr(){ U.lesson.showTr = !U.lesson.showTr; render(); },
  tts(d){ speak(d.t); },
  sr(d){ doSR(d.id, d.t); },
  toggledict(d){
    U.speak[d.id] = U.speak[d.id] || {};
    U.speak[d.id].showDict = !U.speak[d.id].showDict;
    render();
  },
  dictcmp(d){
    const said = ((U.dict||{})[d.id]||"").trim();
    if(!said) return;
    const c = compare(d.t, said);
    U.speak[d.id] = {heard:said, score:c.score, words:c.words, showDict:true};
    render();
  },
  mc(d){ U.lesson.mc[+d.i] = +d.o; render(); },
  fill(d){
    const e = U.lesson.data.exercises[+d.i];
    const val = (U.lesson.inputs[+d.i]||"").trim();
    U.lesson.checked[+d.i] = norm(e.answer) === norm(val) ? "ok" : "bad";
    render();
  },
  trcheck(d){
    U.lesson.tr[+d.i] = {res:true};
    render();
  },
  complete(){ completeLesson(); },
  scen(d){
    startScenario(d.v);
  },
  chatreset(){ U.chat[S.lang] = null; render(); },
  chatsend(){ chatSend(); },
  chatmic(){ chatMic(); },
  drillgen(){ drillGen(); },
  reset(){ S.profiles[S.lang] = freshProfile(); save(); U.view="home"; render(); toast("Progresso limpo."); }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const fn = ACT[b.dataset.act];
  if(fn) fn(b.dataset, b);
});

document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.k;
  if(k){
    const parts = k.split(".");
    let o = U;
    for(let i=0; i<parts.length-1; i++){
      if(o[parts[i]] == null) o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length-1]] = e.target.value;
  }
});

document.addEventListener("DOMContentLoaded", () => {
  render();
});
})();
</script>
