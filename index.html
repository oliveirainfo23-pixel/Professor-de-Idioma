<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Professor de Idioma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;--surface:#FFFFFF;--ink:#16203A;--muted:#566079;--line:#D3D9E4;--soft:#E4E9F3;
  --en:#2D5BD8;--es:#C98C00;--ok:#17804F;--bad:#BF3A30;--mid:#A86A00;
  --accent:var(--en);--on-accent:#FFFFFF;--accent-soft:#DCE5FB;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320;--surface:#181F30;--ink:#E7EBF4;--muted:#A0A9BC;--line:#2B3449;--soft:#1F2840;
    --en:#7C9CFF;--es:#F0B429;--ok:#4CC38A;--bad:#F07167;--mid:#E9B44C;--on-accent:#0F1320;--accent-soft:#25335A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320;--surface:#181F30;--ink:#E7EBF4;--muted:#A0A9BC;--line:#2B3449;--soft:#1F2840;
  --en:#7C9CFF;--es:#F0B429;--ok:#4CC38A;--bad:#F07167;--mid:#E9B44C;--on-accent:#0F1320;--accent-soft:#25335A;
}
body[data-lang="es"]{--accent:var(--es);--on-accent:#16130A;--accent-soft:color-mix(in srgb,var(--es) 18%,var(--surface))}
body[data-lang="en"]{--accent-soft:color-mix(in srgb,var(--en) 16%,var(--surface))}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{background:none;border:0;font-family:var(--display);font-weight:800;font-size:19px;cursor:pointer;padding:4px 0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:700;font-size:16px;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ladder — the signature */
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end}
.ladder li{position:relative;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 2px 2px;background:var(--soft);color:var(--muted);font-family:var(--display);font-weight:700;font-size:13px;padding:4px 0;text-align:center}
.ladder li:nth-child(1){height:22px}.ladder li:nth-child(2){height:30px}.ladder li:nth-child(3){height:38px}
.ladder li:nth-child(4){height:46px}.ladder li:nth-child(5){height:54px}.ladder li:nth-child(6){height:62px}
.ladder li.past{background:color-mix(in srgb,var(--accent) 35%,var(--soft));color:var(--ink)}
.ladder li.now{background:var(--accent);color:var(--on-accent)}

/* home */
.hero{padding:28px 0 22px}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.lede{color:var(--muted);font-size:19px;max-width:52ch;margin:14px 0 0}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.lang-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lang-card[data-l="en"]{--accent:var(--en);--on-accent:#fff}
.lang-card[data-l="es"]{--accent:var(--es);--on-accent:#16130A}
.lc-head{display:flex;justify-content:space-between;align-items:baseline}
.lc-head h2{font-size:26px}
.native{color:var(--muted);font-style:italic}
.lc-level{font-family:var(--display);font-weight:800;font-size:76px;line-height:.9;margin:4px 0 0;color:var(--accent);letter-spacing:-.04em}
.lc-level.empty{color:var(--line)}
.lc-stats{margin:0;color:var(--muted);font-size:15px}
.notice{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:15px}

/* course head */
.course-head{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding:22px 0 18px}
.ch-lang{margin:0;font-weight:700;color:var(--muted)}
.ch-level{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(84px,16vw,132px);line-height:.82;letter-spacing:-.05em;color:var(--accent)}
.ch-side{display:flex;flex-direction:column;gap:10px}
.ch-stats{margin:0;color:var(--muted);font-size:15px;display:flex;gap:18px;flex-wrap:wrap}
.ch-stats b{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* lessons list */
.lvl-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lvl-pills button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px}
.lvl-pills button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lesson-row{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.lesson-row:hover{border-color:var(--accent)}
.lr-n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.lesson-row.done .lr-n{color:var(--ok)}
.lr-t strong{display:block}
.lr-t small{color:var(--muted);font-size:14px}
.lr-s{font-size:14px;color:var(--ok);font-weight:700}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.panel h3{font-size:22px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:15px}
.reading{font-size:19px;line-height:1.7;max-width:66ch;white-space:pre-wrap}
.translation{color:var(--muted);border-left:3px solid var(--line);padding-left:14px;white-space:pre-wrap}
.vocab{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vocab li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.vocab li:last-child{border-bottom:0}
.vocab .term{font-weight:700}
.vocab .ex{grid-column:2;color:var(--muted);font-size:15px;font-style:italic}
.say-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say-btn svg{width:16px;height:16px}
.ex{margin:0}
.exercise{padding:16px 0;border-top:1px solid var(--line)}
.exercise:first-of-type{border-top:0;padding-top:4px}
.ex-q{font-weight:700;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt[disabled]{cursor:default}
.fb{margin:10px 0 0;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.fb.good{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.fb.mid{background:color-mix(in srgb,var(--mid) 14%,var(--surface))}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}

/* speaking */
.say{padding:14px 0;border-top:1px solid var(--line)}
.say:first-child{border-top:0}
.say-text{font-size:19px;margin:0 0 10px}
.say-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w-ok{color:var(--ok)}
.w-miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-family:var(--display);font-weight:800;font-size:20px;margin-left:4px}
.score.good{color:var(--ok)}.score.mid{color:var(--mid)}.score.low{color:var(--bad)}
.heard{margin:8px 0 0;font-size:15px;color:var(--muted)}
.err{margin:8px 0 0;font-size:15px;color:var(--bad)}

/* placement */
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 24px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.q-big{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 22px}
.steps{margin:14px 0 22px;padding-left:22px}
.steps li{margin-bottom:8px}
.result-level{font-family:var(--display);font-weight:800;font-size:clamp(110px,24vw,180px);line-height:.8;letter-spacing:-.05em;color:var(--accent);margin:8px 0 18px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}
.bd{background:var(--soft);border-radius:14px;padding:14px 16px}
.bd h4{margin:0 0 6px;font-family:var(--display);font-size:17px}
.bd p{margin:0;font-size:15px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.bars div{text-align:center;font-size:12px;color:var(--muted)}
.bars i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:3px}
.bars i.g{background:var(--ok)}

/* chat */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.scen button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.scen button:hover{border-color:var(--accent)}
.scen strong{display:block;font-family:var(--display);font-size:18px}
.scen span{color:var(--muted);font-size:14px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.chat-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-bar strong{font-family:var(--display)}
.chat-log{height:min(56vh,520px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.tutor .bubble{background:var(--soft);border-bottom-left-radius:4px}
.msg.me .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.fix{white-space:pre-wrap;font-size:14px;padding:8px 12px;border-radius:10px;border:1px dashed var(--mid);color:var(--ink);background:color-mix(in srgb,var(--mid) 8%,var(--surface))}
.pt{font-size:14px;color:var(--muted);font-style:italic}
.msg-tools{display:flex;gap:6px}
.msg-tools button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;text-decoration:underline}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:46px;height:46px;resize:none;flex:1;scrollbar-width:none}
.composer textarea::-webkit-scrollbar{display:none}
.tip{margin:10px 0 0;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.tip kbd{font-family:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface)}
.dict{margin-top:10px}
.mic{width:46px;height:46px;border-radius:50%;flex:none;padding:0}
.voice-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:var(--accent-soft);font-weight:700}
.voice-bar{flex-wrap:wrap}
.teacher-pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.teacher-pick p{width:100%}
.voice-row{margin-top:12px}
.voice-row select{flex:1;min-width:0}
.voice-stage{height:min(56vh,520px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.vs-title{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);margin:10px 0 0}
.voice-stage .muted{max-width:42ch;margin:0}
.orb{width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.9}
.voice-stage.listening .orb{background:var(--bad);animation:orb 1.6s infinite ease-in-out}
.voice-stage.speaking .orb{animation:orb .9s infinite ease-in-out}
.voice-stage.thinking .orb{opacity:.45;animation:orb 2.4s infinite ease-in-out}
@keyframes orb{0%,100%{transform:scale(.88)}50%{transform:scale(1)}}
.sum-h{font-family:var(--display);font-size:17px;margin:18px 0 6px}
.eval-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.eval-score{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;margin:4px 0;letter-spacing:-.03em}
.eval-score small{font-size:20px;color:var(--muted);font-weight:700}
.eval-score.good{color:var(--ok)}.eval-score.mid{color:var(--mid)}.eval-score.low{color:var(--bad)}
.eval-lvl{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.eval-lvl b{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent)}
.dims{display:grid;gap:10px;margin-top:8px}
.dim-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.dim-bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.dim-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.delta{font-size:13px;font-weight:700;margin-left:4px}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.eq{color:var(--muted);font-weight:400}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 24px}
.plain{margin:0;padding-left:20px}.plain li{margin-bottom:4px}
.vb-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
.live{font-weight:400;font-style:italic;color:var(--muted)}
.voice-bar .btn{flex:none}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.voice-bar.listening .pulse{background:var(--bad);animation:pl 1.2s infinite}
.voice-bar.speaking .pulse{animation:pl .8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.mic svg{width:20px;height:20px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}

/* misc */
.loading{display:flex;gap:12px;align-items:center;padding:28px 0;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw}
.back{margin:18px 0 6px}
.lesson-title{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.done-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.stat span{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl{overflow-x:auto}
.errs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.errs li{font-size:15px;padding:8px 12px;background:var(--soft);border-radius:10px}
.errs s{color:var(--bad)}
.errs b{color:var(--ok)}
@media (max-width:600px){
  .course-head{grid-template-columns:1fr;gap:10px}
  .msg{max-width:92%}
  .wrap{padding:14px 14px 56px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-lang="en">
<div id="app"></div>
<script>
"use strict";
/* ---------- dados fixos ---------- */
const LEVELS=["A1","A2","B1","B2","C1","C2"];
const LANGS={
  en:{name:"Inglês",native:"English",bcp:"en-US",ai:"inglês"},
  es:{name:"Espanhol",native:"Español",bcp:"es-ES",ai:"espanhol"}
};
const BANK={
 en:[
  {l:0,q:"She ___ a teacher.",o:["is","are","am","be"],a:0},
  {l:0,q:"I ___ coffee every morning.",o:["drinks","drink","drinking","am drink"],a:1},
  {l:0,q:"Where ___ you from?",o:["is","do","are","does"],a:2},
  {l:1,q:"Yesterday we ___ to the beach.",o:["go","gone","going","went"],a:3},
  {l:1,q:"This is ___ book I have ever read.",o:["the best","the better","best","more good"],a:0},
  {l:1,q:"There isn't ___ milk in the fridge.",o:["some","any","a","many"],a:1},
  {l:2,q:"If it rains tomorrow, we ___ at home.",o:["would stay","stayed","will stay","stay will"],a:2},
  {l:2,q:"I've lived here ___ 2015.",o:["for","during","from","since"],a:3},
  {l:2,q:"The report ___ by the manager last week.",o:["was written","wrote","has written","is writing"],a:0},

function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=[t.indexOf("{"),t.indexOf("[")].filter(i=>i>=0);const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a.length&&Math.min(...a)<b){try{return JSON.parse(t.slice(Math.min(...a),b+1))}catch(e){}}
  throw{code:"invalid_json",text:t};
}
async function directAI(input,opts,json){
  const key=getKey();if(!key)throw{code:"no_key"};
  const raw=typeof input==="string"?[{role:"user",content:input}]:input;
  const msgs=[];for(const m of raw){const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+="\n\n"+m.content;else msgs.push({role:m.role,content:m.content})}
  const body={model:MODELS[opts.modelTier||"default"],max_tokens:json?6000:1500,messages:msgs};
  if(json)body.system="Responda somente com JSON válido, sem texto antes ou depois e sem cercas de código.";
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)})}
  catch(e){throw{code:e&&e.name==="AbortError"?"cancelled":"network"}}
  if(!r.ok){let m="";try{m=(await r.json()).error.message||""}catch(e){}
    throw{code:r.status===401||r.status===403?"bad_key":r.status===429?"rate_limited":r.status===400?"bad_request":r.status===529?"overloaded":"upstream_error",message:m}}
  const data=await r.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!text)throw{code:"empty_completion"};
  if(opts.onText)opts.onText({text,delta:text});
  return json?parseJSON(text):{text,truncated:data.stop_reason==="max_tokens"};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* Escuta contínua: só encerra depois de uma pausa real (ajustável), não na primeira respirada. */
let activeListen=null;
function listen(lang=S.lang,{onInterim,pauseMs}={}){
  return new Promise((res,rej)=>{
    if(!SR)return rej({code:"no_sr"});
    const pause=pauseMs||Math.round((S.settings.pause||2.5)*1000);
    const maxWait=15000;
    let base="",sessF="",interim="",done=false,silenceT=null,rec=null;
    const text=()=>(base+" "+sessF+" "+interim).replace(/\s+/g," ").trim();
    const finish=(ok,err)=>{
      if(done)return;done=true;
      clearTimeout(silenceT);clearTimeout(startT);activeListen=null;
      try{rec&&rec.abort()}catch(e){}
      const t=text();
      if(ok&&t)res(t);else rej(err||{code:"no-speech"});
    };
    const startT=setTimeout(()=>{if(!text())finish(false,{code:"no-speech"})},maxWait);
    const armSilence=()=>{clearTimeout(silenceT);silenceT=setTimeout(()=>finish(true),pause)};
    const start=()=>{
      if(done)return;
      try{rec=new SR()}catch(e){return finish(false,{code:"no_sr"})}
      activeRec=rec;
      rec.lang=LANGS[lang].bcp;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=e=>{
        let f="",it="";
        for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)f+=t+" ";else it+=t+" "}
        sessF=f;interim=it;
        if(onInterim)onInterim(text());
        if(text())armSilence();
      };
      rec.onerror=e=>{
        if(done)return;
        if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error))finish(false,{code:e.error});
        else if(e.error==="network")finish(false,{code:"network-sr"});
      };
      rec.onend=()=>{
        if(done)return;
        base=(base+" "+sessF+" "+interim).trim();sessF="";interim="";
        setTimeout(start,120);
      };
      try{rec.start()}catch(e){finish(false,{code:"start"})}
    };
    activeListen={finishNow:()=>finish(true),cancel:()=>finish(false,{code:"aborted"})};
    start();
  });
}

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim()}
function compare(target,said){
  const toks=target.split(/\s+/).filter(Boolean);
  const a=toks.map(t=>norm(t).replace(/\s/g,""));
  const b=norm(said).split(" ").filter(Boolean);
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]&&a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]&&a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  a.forEach((w,k)=>{if(!w)ok[k]=true});
  const real=a.filter(Boolean).length||1;
  const hit=a.filter((w,k)=>w&&ok[k]).length;
  return{score:Math.round(hit/real*100),words:toks.map((t,k)=>({t,ok:ok[k]}))};
}

function ladder(lv){const idx=lv?LEVELS.indexOf(lv):-1;return`<ol class="ladder" aria-label="Escala de níveis">${LEVELS.map((l,i)=>`<li class="${i<idx?"past":i===idx?"now":""}"${i===idx?' aria-current="step"':""}><span>${l}</span></li>`).join("")}</ol>`}

function speakItem(id,sentence){
  const r=U.speak[id]||{};
  const text=r.words?r.words.map(w=>`<span class="${w.ok?"w-ok":"w-miss"}">${esc(w.t)}</span>`).join(" "):esc(sentence);
  const sc=r.score!=null?`<span class="score ${r.score>=75?"good":r.score>=50?"mid":"low"}">${r.score}%</span>`:"";
  return`<div class="say"><p class="say-text">${text}</p><div class="say-row">

async function doSR(id,t){
  U.speak[id]={...(U.speak[id]||{}),listening:true,err:""};render();
  try{const heard=await listen(S.lang,{onInterim:x=>{const el=document.getElementById("live-"+id);if(el)el.textContent=x}});const c=compare(t,heard);U.speak[id]={heard,score:c.score,words:c.words}}
  catch(e){if(["not-allowed","service-not-allowed","no_sr"].includes(e&&e.code))micBlocked=true;U.speak[id]={...(U.speak[id]||{}),listening:false,err:srMsg(e)}}
  render();
}

function computeResult(){
  const pl=U.pl,bank=BANK[S.lang];
  const per=[0,1,2,3,4].map(l=>bank.reduce((c,q,i)=>c+(q.l===l&&pl.ans[i]===q.a?1:0),0));
  let mcq=0;for(let l=0;l<5;l++){if(per[l]>=2)mcq=l;else break}
  const correct=per.reduce((a,b)=>a+b,0);
  const w=pl.wres&&LEVELS.includes(pl.wres.level)?LEVELS.indexOf(pl.wres.level):null;
  const sp=PL_SPEAK[S.lang].map((s,i)=>({l:s.l,r:U.speak["pl-"+S.lang+"-"+i]})).filter(x=>x.r&&x.r.score!=null);
  let s=null,sAvg=0;
  if(sp.length){sAvg=Math.round(sp.reduce((a,x)=>a+x.r.score,0)/sp.length);s=0;sp.forEach(x=>{if(x.r.score>=75)s=Math.max(s,x.l)})}
  const parts=[[mcq,.55]];if(w!=null)parts.push([w,.3]);if(s!=null)parts.push([s,.15]);
  const tw=parts.reduce((a,p)=>a+p[1],0);
  const final=Math.max(0,Math.min(5,Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/tw)));
  pl.result={per,mcq,correct,w,s,sAvg};pl.chosen=LEVELS[final];
}
async function plWrite(){
  const pl=U.pl,txt=(pl.wtext||"").trim();
  if(txt.split(/\s+/).length<5){pl.werr="Escreva pelo menos uma ou duas frases para a avaliação funcionar.";render();return}
  pl.wbusy=true;pl.werr="";render();
  try{
    const r=await ai(`Avalie o nível QECR (A1 a C2) de um texto em ${L().ai} escrito por um brasileiro numa avaliação de nivelamento.
Tarefa dada: "${PL_WRITE[S.lang]}"
Considere gramática, vocabulário, coesão e quantidade de texto. Se o texto estiver em português ou quase vazio, classifique como A1.
Texto do aluno:
"""${txt.slice(0,3000)}"""
Responda apenas com JSON: {"level":"B1","reason":"1-2 frases em português justificando","strengths":"pontos fortes em 1 frase, em português","improve":"o que melhorar em 1 frase, em português"}`,{modelTier:"default"},true);
    if(!r||!LEVELS.includes(r.level))throw{code:"invalid_json"};
    pl.wres=r;
  }catch(e){pl.werr=aiMsg(e)}
  pl.wbusy=false;render();
}

async function openLesson(key){
  const [lv,i]=key.split("-");const t=TOPICS[lv][+i];
  U.lesson={key,lv,topic:t,data:null,loading:true,err:"",inputs:{},checked:{},mc:{},tr:{},wtext:"",wres:null,wbusy:false,werr:"",showTr:false,ctl:null};
  U.view="lesson";render();window.scrollTo(0,0);
  const sk=`lesson-${S.lang}-${key}`;
  const cached=await lessonGet(sk);
  if(U.lesson&&U.lesson.key===key&&cached){U.lesson.data=cached;U.lesson.loading=false;render();return}
  generateLesson();
}
function validLesson(d){
  if(!d||typeof d!=="object"||!d.reading||!d.reading.text)return null;
  d.vocabulary=Array.isArray(d.vocabulary)?d.vocabulary.filter(v=>v&&v.term):[];
  d.grammar=d.grammar||{title:"",explanation:"",examples:[]};
  d.grammar.examples=Array.isArray(d.grammar.examples)?d.grammar.examples:[];

/* conversa */
function chatRules(c){
  const lv=P().level,sc=SCEN.find(s=>s.k===c.scenario),lang=L().ai,basic=["A1","A2"].includes(lv);
  const letters=S.lang==="es"?"a, be, ce, de, e, efe, ge, hache, i, jota, ka, ele, eme, ene, eñe, o, pe, cu, erre, ese, te, u, uve, uve doble, equis, ye, zeta":"ay, bee, see, dee, ee, ef, gee, aitch, eye, jay, kay, el, em, en, oh, pee, cue, ar, ess, tee, you, vee, double-u, ex, why, zee";
  const g=c.g==="f"?"f":"m",nm=TEACH[S.lang][g];
  return`Você é ${nm}, ${g==="f"?"uma professora (mulher)":"um professor (homem)"} de ${lang} nativ${g==="f"?"a":"o"}, que conversa com um aluno brasileiro de nível ${lv} (QECR), fazendo um papel numa situação real. Cenário: ${sc.d}.
Fale sempre como ${g==="f"?"mulher":"homem"}: use a concordância de gênero correta quando falar de si mesm${g==="f"?"a":"o"} e adapte o papel do cenário (${g==="f"?"garçonete, atendente, entrevistadora, vendedora, farmacêutica":"garçom, atendente, entrevistador, vendedor, farmacêutico"}). Se se apresentar, use o nome ${nm}.
Seu objetivo é que a conversa pareça natural e humana, e que o aluno pratique e aprenda.

COMO FALAR
- Responda sempre em ${lang}, com ${basic?"1 ou 2 frases curtas e vocabulário muito simples":"1 a 3 frases"}, adequadas ao nível ${lv}.
- Faça UMA pergunta por vez e espere a resposta. Não presuma informações que o aluno não deu (datas, preços que ele não perguntou, tipo de quarto, nomes): pergunte.
- Confirme brevemente o que entendeu antes de seguir, como uma pessoa real faria.
- Sua resposta será lida em voz alta: não use símbolos, listas, parênteses, abreviações nem emojis.

ENTENDER O ALUNO (voz)
- As mensagens do aluno vêm de reconhecimento de voz e podem ter erros de transcrição: palavras trocadas, nomes escritos errado, frases cortadas no meio, falta de pontuação. Interprete a intenção mais provável pelo contexto da conversa.
- Se a frase parecer cortada ou incompleta, peça gentilmente para o aluno completar, sem corrigir.
- Se o aluno soletrar, interprete os nomes das letras (${letters}) e também letras soltas. Confirme o nome uma vez; se ainda houver dúvida, aceite a melhor versão e siga em frente. Nunca insista mais de uma vez no mesmo detalhe.
- Se o aluno mostrar que não entendeu (por exemplo: "no entiendo", "qué", "cómo", "duda", "what", "sorry", repetir sua pergunta ou responder algo fora de contexto), repita a pergunta com palavras mais simples e ofereça duas opções de resposta.
- Se o aluno falar em português, responda em ${lang} de forma simples e ensine como dizer aquilo.

CORRIGIR
- Quando o aluno errar, use a reformulação natural: na sua resposta, repita a forma correta do que ele quis dizer, sem interromper a conversa. Exemplo: aluno diz "Sí acepta tarjeta" e você responde "¿Si aceptamos tarjeta? Sí, claro, aceptamos tarjeta."
- Depois da sua resposta, pule uma linha e escreva UMA linha começando com ✎, em português, com a frase do aluno corrigida e o motivo em poucas palavras. Se houver mais de um erro, junte tudo nessa mesma linha.
- Corrija apenas erros reais de gramática e vocabulário. Não corrija pontuação, maiúsculas, nomes próprios nem o que parecer erro de transcrição. Se não houver erro real, não escreva a linha ✎.`;
}
function splitFix(t){const i=t.indexOf("✎");return i<0?{reply:t.trim(),fix:""}:{reply:t.slice(0,i).trim(),fix:t.slice(i+1).trim()}}
function chatTurns(c){
  const first={role:"user",content:chatRules(c)+"\n\nComece você a conversa: cumprimente o aluno e faça a primeira pergunta do cenário."};
  let msgs=c.msgs.filter(m=>!m.pending&&m.text);
  if(msgs.length>21)msgs=[msgs[0],...msgs.slice(-20)];
  return[first,...msgs.map(m=>m.who==="me"?{role:"user",content:m.text}:{role:"assistant",content:m.text+(m.fix?"\n✎ "+m.fix:"")})];
}
async function tutorReply(voice=false){
  const c=U.chat[S.lang],lang=S.lang;
  const msg={who:"tutor",text:"",fix:"",pending:true};c.msgs.push(msg);c.busy=true;
  const ctl=new AbortController();c.ctl=ctl;render();
  try{
    const turns=chatTurns(c);
    const {text}=await ai(turns,{cache:false,modelTier:"default",signal:ctl.signal,onText:({text})=>{const el=document.getElementById("pending-bubble");if(el)el.textContent=splitFix(text).reply||"…"}});
    const s=splitFix(text);msg.text=s.reply;msg.fix=s.fix;msg.pending=false;
    if(!voice&&S.settings.autoSpeak&&S.lang===lang)speak(s.reply,lang,c.g);
    c.busy=false;c.ctl=null;render();
    return s.reply;
  }catch(e){
    const keep=e&&e.text?splitFix(e.text).reply:"";
    if(keep){msg.text=keep;msg.pending=false}else{c.msgs.splice(c.msgs.indexOf(msg),1)}
    if(!(e&&e.code==="cancelled"))c.err=aiMsg(e);
  }
  c.busy=false;c.ctl=null;render();
  return null;
}
async function voiceLoop(){
  const lang=S.lang,c=U.chat[lang];if(!c||U.voice)return;
  try{speechSynthesis.cancel()}catch(e){}
  U.voice=true;U.micErr="";c.err="";c.summary=null;c.sumErr="";
  const last=c.msgs[c.msgs.length-1];
  if(last&&last.who==="tutor"&&last.text){
    U.voiceState="speaking";render();await speakAsync(last.text,lang,c.g);await new Promise(r=>setTimeout(r,400));
  }
  let misses=0;
  while(U.voice&&U.chat[lang]===c&&S.lang===lang){
    U.voiceState="listening";render();
    let t;
    try{t=await listen(lang,{onInterim:x=>{const el=document.getElementById("live-text");if(el)el.textContent=x}})}
    catch(e){
      const code=e&&e.code;
      if(code==="aborted"||!U.voice)break;
      if(code==="no-speech"&&misses<1){misses++;continue}
      if(["not-allowed","service-not-allowed","no_sr"].includes(code))micBlocked=true;
      U.micErr=micBlocked?"":code==="no-speech"?"Não ouvi nada por um tempo, então pausei a conversa. Toque em Conversar por voz para continuar.":srMsg(e);
      break;
    }
    misses=0;
    if(!U.voice)break;
    c.msgs.push({who:"me",text:t});
    U.voiceState="thinking";render();
    const reply=await tutorReply(true);
    if(!reply||!U.voice)break;
    U.voiceState="speaking";render();
    await speakAsync(reply,lang,c.g);
    await new Promise(r=>setTimeout(r,450));
  }
  U.voice=false;U.voiceState="";render();
  if(U.chat[lang]===c&&c.msgs.slice(c.evalFrom||0).some(m=>m.who==="me"))summarize(c,lang);
}
const DIMS=[["compreensao","Compreensão"],["vocabulario","Vocabulário"],["gramatica","Gramática"],["fluencia","Fluência"],["interacao","Interação"]];
async function summarize(c,lang){
  if(c.sumBusy)return;
  const sc=SCEN.find(s=>s.k===c.scenario),p=S.profiles[lang],lv=p.level;
  const from=c.evalFrom||0,to=c.msgs.length;
  const part=c.msgs.slice(from,to).filter(m=>m.text&&!m.pending);
  if(!part.some(m=>m.who==="me"))return;
  const conv=part.map(m=>(m.who==="me"?"Aluno: ":"Professor: ")+m.text).join("\n");
  const prev=p.convs.slice(-5);
  const hist=prev.length?prev.map(h=>`${h.date} (${h.scen}): nota ${h.nota}, nível ${h.nivel}, `+DIMS.map(([k,n])=>`${n.toLowerCase()} ${h.comp&&h.comp[k]!=null?h.comp[k]:"?"}`).join(", ")+(h.melhorar&&h.melhorar.length?`; a melhorar: ${h.melhorar.join("; ")}`:"")).join("\n"):"Nenhuma: esta é a primeira conversa avaliada.";
  c.sumBusy=true;c.sumErr="";c.summary=null;render();
  try{
    const r=await ai(`Você é professor de ${LANGS[lang].ai}. Avalie o desenvolvimento de um aluno brasileiro de nível ${lv} (QECR) numa conversa no cenário: ${sc.d}. As falas do aluno foram transcritas por reconhecimento de voz e podem ter erros de transcrição.
Analise SOMENTE as falas do aluno. Não penalize o que parecer erro de transcrição (nomes próprios, palavras soltas sem sentido, frases cortadas).

Conversa:
${conv.slice(-8000)}

Avaliações anteriores deste aluno (mais antigas primeiro):
${hist}

Avalie cada competência de 0 a 10, considerando o que se espera do nível ${lv}:
- compreensao: entendeu as perguntas e respondeu ao que foi perguntado
- vocabulario: variedade e adequação das palavras ao cenário
- gramatica: correção das estruturas
- fluencia: frases completas, sem travar, sem depender de palavras soltas

function delta(v,prev){if(v==null||prev==null)return"";const d=Math.round((v-prev)*10)/10;if(Math.abs(d)<0.5)return`<span class="delta eq">igual</span>`;return`<span class="delta ${d>0?"up":"down"}">${d>0?"▲ +":"▼ "}${Math.abs(d)>=1?Math.round(d):d}</span>`}
function summaryHTML(c){
  if(c.sumBusy)return`<div class="panel" style="margin-top:16px"><div class="loading" style="padding:0">${dots} Avaliando a conversa…</div></div>`;
  if(c.sumErr)return`<div class="panel" style="margin-top:16px"><p class="err">${esc(c.sumErr)}</p><button class="btn sm" data-act="resum">Tentar de novo</button></div>`;
  const s=c.summary;if(!s)return"";
  return`<section class="panel eval" style="margin-top:16px">
  <div class="eval-head"><div><p class="muted small" style="margin:0">Avaliação da conversa</p><p class="eval-score ${s.nota>=75?"good":s.nota>=50?"mid":"low"}">${s.nota}<small>/100</small></p>${s.prevNota!=null?`<p class="small muted" style="margin:0">Média das últimas conversas: ${s.prevNota}</p>`:""}</div>
    <div class="eval-lvl"><span class="muted small">Nível nesta conversa</span><b>${esc(s.nivel)}</b><span class="muted small">Seu nível no curso: ${esc(P().level)}</span></div></div>
  <p>${esc(s.geral)}</p>
  <div class="dims">${DIMS.map(([k,n])=>{const v=s.comp[k];return`<div class="dim"><div class="dim-top"><span>${n}</span><span><b>${v==null?"–":v}</b>/10 ${delta(v,s.prevAvg[k])}</span></div><div class="dim-bar"><i style="width:${v==null?0:v*10}%"></i></div></div>`}).join("")}</div>
  ${s.count?`<p class="small muted" style="margin:6px 0 0">Setas comparam com a média das suas ${s.count} ${s.count===1?"conversa anterior":"conversas anteriores"}.</p>`:""}
  ${s.evolucao?`<h4 class="sum-h">Sua evolução</h4><p style="margin:0">${esc(s.evolucao)}</p>`:""}
  <div class="two-col">${s.fortes.length?`<div><h4 class="sum-h">Pontos fortes</h4><ul class="plain">${s.fortes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}${s.melhorar.length?`<div><h4 class="sum-h">Para melhorar</h4><ul class="plain">${s.melhorar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</div>
  ${s.correcoes.length?`<h4 class="sum-h">Correções</h4><ul class="errs">${s.correcoes.map(x=>`<li><s>${esc(x.disse)}</s><br><span class="row" style="gap:6px;flex-wrap:nowrap">${sayBtn(x.melhor)}<b>${esc(x.melhor)}</b></span><span class="muted">${esc(x.porque)}</span></li>`).join("")}</ul>`:""}
  ${s.frases.length?`<h4 class="sum-h">Frases úteis para esta situação</h4><ul class="vocab">${s.frases.map(f=>`<li>${sayBtn(f.frase)}<div><span class="term">${esc(f.frase)}</span> <span class="muted">${esc(f.significado)}</span></div></li>`).join("")}</ul>`:""}
  ${s.dica?`<p class="fb"><b>Para a próxima conversa:</b> ${esc(s.dica)}</p>`:""}</section>`;
}
function stopVoice(){
  U.voice=false;U.voiceState="";
  try{activeListen&&activeListen.cancel()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  const c=U.chat[S.lang];if(c&&c.ctl)c.ctl.abort();
  render();
}
function chatSend(){
  const c=U.chat[S.lang];if(!c||c.busy)return;
  const t=(U.chatInput||"").trim();if(!t)return;
  c.err="";c.msgs.push({who:"me",text:t});U.chatInput="";tutorReply();
}

    <button class="btn ghost sm" data-act="tts" data-g="${tg}" data-t="${esc(S.lang==="es"?`Hola, soy ${TEACH.es[tg]}. ¡Vamos a practicar juntos!`:`Hi, I'm ${TEACH.en[tg]}. Let's practice together!`)}">${ICON_SPK} Ouvir a voz</button></div>

    <button class="btn ghost sm" data-act="chatreset">Trocar situação</button>
    ${!U.voice&&!c.busy&&!c.sumBusy&&c.msgs.slice(c.evalFrom||0).some(m=>m.who==="me")?`<button class="btn ghost sm" data-act="resum">Encerrar e avaliar</button>`:""}
    ${U.voice||micBlocked?"":`<button class="btn primary sm" data-act="voicestart" ${c.busy?"disabled":""}>${ICON_MIC} Conversar por voz</button>`}</div></div>
    ${U.voice&&!U.showText?`<div class="voice-stage ${U.voiceState}"><div class="orb"></div><p class="vs-title">${U.voiceState==="listening"?"Pode falar":U.voiceState==="thinking"?"Pensando…":"Ouça "+who}</p><p class="muted small">${U.voiceState==="listening"?"Fale com calma. Quando terminar, faça uma pausa ou toque em Terminei de falar.":"A conversa está só no áudio. As correções aparecem no resumo quando você parar."}</p><button class="linkish" data-act="showtext">Mostrar texto da conversa</button></div>`:`<div class="chat-log" id="chat-log" aria-live="polite">${U.voice?`<p style="margin:0"><button class="linkish" data-act="showtext">Esconder texto</button></p>`:""}${c.msgs.map((m,i)=>m.who==="me"?`<div class="msg me"><div class="bubble">${esc(m.text)}</div></div>`:
      `<div class="msg tutor"><div class="bubble" ${m.pending?'id="pending-bubble"':""}>${m.pending?(esc(m.text)||"…"):esc(m.text)}</div>
      ${m.fix?`<div class="fix">✎ ${esc(m.fix)}</div>`:""}${m.pt?`<div class="pt">${esc(m.pt)}</div>`:""}
      ${m.pending?"":`<div class="msg-tools"><button data-act="tts" data-t="${esc(m.text)}" data-g="${c.g||""}">Ouvir</button><button data-act="chatpt" data-i="${i}">${m.ptBusy?"Traduzindo…":"Ver em português"}</button></div>`}</div>`).join("")}
      ${c.err?`<p class="err">${esc(c.err)}</p>`:""}</div>`}
    ${U.voice?`<div class="voice-bar ${U.voiceState}"><span class="pulse"></span><span class="vb-main"><span>${U.voiceState==="listening"?"Ouvindo… fale com calma em "+L().name.toLowerCase():U.voiceState==="thinking"?"Pensando na resposta…":TEACH[S.lang][c.g==="f"?"f":"m"]+" falando…"}</span>${U.voiceState==="listening"&&U.showText?`<span class="live" id="live-text"></span>`:""}</span>${U.voiceState==="listening"?`<button class="btn primary sm" data-act="voicedone">Terminei de falar</button>`:""}<button class="btn sm" data-act="voicestop">Parar</button></div>`:""}
    <div class="composer"><button class="btn mic ${U.listening?"rec":""}" data-act="chatmic" aria-label="${U.listening?"Terminei de falar":"Falar pelo microfone"}" title="${U.listening?"Toque para enviar":"Falar"}" ${c.busy?"disabled":""}>${ICON_MIC}</button>
      <textarea id="chat-in" data-k="chatInput" placeholder="${U.listening?"Ouvindo…":"Escreva em "+L().name.toLowerCase()+"…"}" aria-label="Mensagem">${esc(U.chatInput)}</textarea>
      ${c.busy?`<button class="btn" data-act="chatstop">Parar</button>`:`<button class="btn primary" data-act="chatsend">Enviar</button>`}</div></div>
    ${U.micErr?`<p class="err">${esc(U.micErr)}</p>`:""}
    ${U.voice?"":summaryHTML(c)}
    ${micBlocked?`<p class="tip">${inClaude?"Dentro do claude.ai o microfone fica bloqueado, então a conversa só por voz funciona na versão independente deste app (no seu próprio endereço). Aqui, use o ditado: ":"Para falar: "}${dictHint()} e fale em ${L().name.toLowerCase()}. O texto aparece na caixa; depois toque em Enviar.</p>`:""}`;
}
async function chatPt(i){
  const c=U.chat[S.lang],m=c.msgs[+i];if(!m||m.ptBusy)return;
  if(m.pt){m.pt="";render();return}
  m.ptBusy=true;render();
  try{const {text}=await ai(`Traduza para o português do Brasil, sem comentários, apenas a tradução:\n\n${m.text}`,{modelTier:"quick"});m.pt=text.trim()}
  catch(e){c.err=aiMsg(e)}
  m.ptBusy=false;render();
}

/* pronúncia */
function drillView(){
  const d=U.drill[S.lang];
  return`<div class="panel"><h3>Treino de pronúncia</h3><p class="muted small">Gere frases do seu nível ou digite uma frase que você quer treinar. Ouça, repita e veja quais palavras foram reconhecidas.</p>
    <div class="row" style="margin-bottom:12px">${d.busy?`<span class="loading" style="padding:0">${dots} Gerando frases…</span>`:`<button class="btn primary" data-act="drillgen">Gerar 5 frases de nível ${P().level}</button>`}</div>
    ${d.err?`<p class="err">${esc(d.err)}</p>`:""}
    <div class="inline-form"><input type="text" data-k="drillCustom" value="${esc(U.drillCustom)}" placeholder="Ou digite sua frase em ${L().name.toLowerCase()}" aria-label="Frase para treinar"><button class="btn" data-act="drilladd">Treinar esta frase</button></div></div>
  ${d.items.length?`<div class="panel">${d.items.map((s,i)=>speakItem(`dr-${S.lang}-${i}-${s.length}`,s)).join("")}</div>`:""}`;
}
async function drillGen(){
  const d=U.drill[S.lang],lv=P().level;d.busy=true;d.err="";render();
  try{
    const r=await ai(`Gere 5 frases variadas em ${L().ai} para treino de pronúncia de um aluno brasileiro de nível ${lv} (QECR), com ${["A1","A2"].includes(lv)?"5 a 10":"10 a 18"} palavras cada, sobre temas do dia a dia e do trabalho. Inclua sons difíceis para brasileiros. Responda apenas com um array JSON de 5 strings.`,{modelTier:"quick",cache:false},true);
    if(!Array.isArray(r))throw{code:"invalid_json"};
    d.items=r.filter(x=>typeof x==="string"&&x.trim()).slice(0,5);
    Object.keys(U.speak).forEach(k=>{if(k.startsWith("dr-"+S.lang))delete U.speak[k]});
  }catch(e){d.err=aiMsg(e)}
  d.busy=false;render();
}

/* ---------- ações ---------- */
const ACT={
  home(){U.view="home";U.lesson=null;render();window.scrollTo(0,0)},
  lang(d){if(S.lang===d.v)return;if(U.voice)stopVoice();S.lang=d.v;save();U.browse=null;U.micErr="";if(U.view==="lesson")U.view="course";if((U.view==="course")&&!P().level)U.view="home";if(U.view==="placement")U.view="home";render()},
  open(d){S.lang=d.v;save();U.view="course";U.browse=null;render();window.scrollTo(0,0)},
  startpl(d){S.lang=d.v;save();U.pl={step:"intro",i:0,ans:[],wtext:"",wres:null,wbusy:false,werr:""};Object.keys(U.speak).forEach(k=>{if(k.startsWith("pl-"+S.lang))delete U.speak[k]});U.view="placement";render();window.scrollTo(0,0)},
  plgo(){U.pl.step="mcq";render()},
  plans(d){const pl=U.pl;pl.ans[pl.i]=+d.v;pl.i++;if(pl.i>=BANK[S.lang].length)pl.step="write";render()},
  plwrite(){plWrite()},
  plnext(d){U.pl.step=d.v;render();window.scrollTo(0,0)},
  plresult(){computeResult();U.pl.step="result";render();window.scrollTo(0,0)},
  plfinish(){const p=P();p.level=U.pl.chosen;p.history.push({date:today(),level:U.pl.chosen});save();U.view="course";U.tab="lessons";U.browse=null;U.pl=null;render();window.scrollTo(0,0)},
  tab(d){if(U.voice)stopVoice();U.tab=d.v;U.micErr="";render()},
  browse(d){U.browse=d.v;render()},
  lesson(d){openLesson(d.v)},
  backcourse(){if(U.lesson&&U.lesson.ctl)U.lesson.ctl.abort();U.lesson=null;U.view="course";render();window.scrollTo(0,0)},
  cancelgen(){if(U.lesson&&U.lesson.ctl)U.lesson.ctl.abort()},
  regen(){generateLesson()},
  toggletr(){U.lesson.showTr=!U.lesson.showTr;render()},
  tts(d){speak(d.t,S.lang,d.g||null)},
  vtest(d){speak(d.l==="es"?`Hola, soy ${TEACH.es[d.g]}, tu ${d.g==="f"?"profesora":"profesor"} de español.`:`Hi, I'm ${TEACH.en[d.g]}, your English teacher.`,d.l,d.g)},
  teacher(d){S.settings.teacher=d.v;save();render()},
  stoptts(){try{speechSynthesis.cancel()}catch(e){}},
  sr(d){if(U.speak[d.id]&&U.speak[d.id].listening){activeListen&&activeListen.finishNow();return}if(activeListen)return;doSR(d.id,d.t)},
  mc(d){U.lesson.mc[+d.i]=+d.o;render()},
  fill(d){checkFill(+d.i)},
  showfill(d){U.lesson.checked[+d.i]="shown";render()},
  trcheck(d){trCheck(+d.i)},
  lwrite(){lWrite()},
  complete(){completeLesson()},
  scen(d){U.chat[S.lang]={scenario:d.v,g:S.settings.teacher==="f"?"f":"m",msgs:[],busy:false,err:""};U.micErr="";tutorReply()},
  chatreset(){stopVoice();const c=U.chat[S.lang];if(c&&c.ctl)c.ctl.abort();U.chat[S.lang]=null;render()},
  voicestart(){voiceLoop()},
  voicestop(){stopVoice()},
  voicedone(){activeListen&&activeListen.finishNow()},
  showtext(){U.showText=!U.showText;render()},
  resum(){const c=U.chat[S.lang];if(c)summarize(c,S.lang)},
  settings(){U.view="settings";U.keyStatus="";U.keyInput=undefined;render();window.scrollTo(0,0)},
  async savekey(){
    const k=(U.keyInput??getKey()).trim();if(!k){U.keyStatus="Cole sua chave antes de salvar.";render();return}
    setKey(k);U.keyStatus="testing";render();
    try{await directAI("Responda apenas: ok",{modelTier:"quick"},false);U.keyStatus="ok";aiAvail=true}
    catch(e){U.keyStatus=aiMsg(e)}
    render();
  },
  delkey(){setKey("");U.keyInput="";U.keyStatus="";aiAvail=!!inClaude;render()},
  chatsend(){chatSend()},
  chatstop(){const c=U.chat[S.lang];if(c&&c.ctl)c.ctl.abort()},
  async chatmic(){
    const c=U.chat[S.lang];if(!c||c.busy)return;
    if(U.listening){activeListen&&activeListen.finishNow();return}
    if(U.voice||activeListen)return;
    U.listening=true;U.micErr="";render();
    try{const t=await listen(S.lang,{onInterim:x=>{const ta=document.getElementById("chat-in");if(ta)ta.value=x}});U.listening=false;U.chatInput=t;chatSend()}
    catch(e){U.listening=false;if(["not-allowed","service-not-allowed","no_sr"].includes(e&&e.code)){micBlocked=true;U.micErr=""}else U.micErr=srMsg(e);render();const ta=document.getElementById("chat-in");if(ta&&micBlocked)ta.focus()}
  },
  chatpt(d){chatPt(d.i)},
  drillgen(){drillGen()},
  dictcmp(d){const said=((U.dict||{})[d.id]||"").trim();if(!said)return;const c=compare(d.t,said);U.speak[d.id]={heard:said,score:c.score,words:c.words};U.dict[d.id]="";render()},
  drilladd(){const t=(U.drillCustom||"").trim();if(!t)return;U.drill[S.lang].items.unshift(t);U.drillCustom="";render()},
  askreset(){U.showReset=true;render()},
  noreset(){U.showReset=false;render()},
  reset(){S.profiles[S.lang]=freshProfile();save();U.showReset=false;U.chat[S.lang]=null;U.view="home";render();toast("Progresso apagado.")}
};
const CHG={
  plchoose(el){U.pl.chosen=el.value;render()},
  setlevel(el){const p=P();if(p.level===el.value)return;p.level=el.value;p.history.push({date:today(),level:el.value,manual:true});save();U.browse=null;render()},
  rate(el){S.settings.rate=+el.value;save();render()},
  pause(el){S.settings.pause=+el.value;save();render()},
  voicesel(el){S.settings.voices=S.settings.voices||{};if(el.value)S.settings.voices[el.dataset.v]=el.value;else delete S.settings.voices[el.dataset.v];save()},
  autospeak(el){S.settings.autoSpeak=el.checked;save()}
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.type==="range"||b.type==="checkbox")return;
  const f=ACT[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)setPath(k,e.target.value)});
document.addEventListener("change",e=>{const a=e.target.dataset&&e.target.dataset.act;if(a&&CHG[a])CHG[a](e.target)});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.shiftKey)return;
  if(e.target.id==="chat-in"){e.preventDefault();chatSend()}
  else if(e.target.matches&&e.target.matches('input[data-k^="lesson.inputs."]')){e.preventDefault();const i=e.target.dataset.k.split(".")[2];const ex=U.lesson.data.exercises[+i];if(ex.type==="fill")checkFill(+i);else trCheck(+i)}
  else if(e.target.matches&&e.target.matches('input[data-k="drillCustom"]')){e.preventDefault();ACT.drilladd()}
});
render();
